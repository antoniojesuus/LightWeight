<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>LightWeight — Seguimiento de entrenos</title>
<meta name="description" content="App local de seguimiento de entrenamientos en el gimnasio." />
<meta name="theme-color" content="#09090b" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LightWeight" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #09090b;            /* zinc-950 */
    --surface: #18181b;       /* zinc-900 */
    --surface-2: #27272a;     /* zinc-800 */
    --surface-3: #3f3f46;     /* zinc-700 */
    --surface-soft: rgba(39, 39, 42, .6); /* zinc-800/60 */
    --border: #27272a;
    --text: #f4f4f5;          /* zinc-100 */
    --muted: #a1a1aa;         /* zinc-400 */
    --faint: #71717a;         /* zinc-500 */
    --accent: #a3e635;        /* lime-400 */
    --accent-ink: #09090b;
    --accent-soft: rgba(163, 230, 53, .15);
    --accent-line: rgba(163, 230, 53, .3);
    --danger: #dc2626;        /* red-600 */
    --radius-lg: 1rem;
    --radius-md: .75rem;
    --radius-sm: .5rem;
  }
  /* ---- Componentes (1 solo sitio para cambiar el look) ---- */
  .card { background-color: var(--surface); border-radius: var(--radius-lg); padding: 1rem; }
  .card-soft { background-color: var(--surface-soft); border-radius: var(--radius-md); padding: .75rem; }
  .card-accent { border: 1px solid var(--accent-line); }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    font-weight: 700; border-radius: var(--radius-md);
    min-height: 44px; padding: .5rem 1rem;
    transition: transform .1s ease-out, filter .15s ease-out;
    cursor: pointer;
  }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background-color: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-ghost { background-color: var(--surface-3); color: var(--text); }
  .btn-quiet { background-color: var(--surface-2); color: var(--text); font-weight: 600; }
  .btn-danger { background-color: var(--danger); color: #fff; }
  .btn-sm { min-height: 32px; padding: .25rem .75rem; font-size: .75rem; border-radius: var(--radius-sm); }
  .input {
    background-color: var(--surface-2); color: var(--text);
    border-radius: var(--radius-md); padding: .5rem .75rem; font-size: .875rem;
    min-width: 0;
  }
  .input::placeholder { color: var(--faint); }
  .input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .input-sm { border-radius: var(--radius-sm); padding: .25rem .5rem; }
  .chip {
    display: inline-flex; align-items: center;
    font-size: .75rem; background-color: var(--surface-2); color: var(--text);
    border-radius: 9999px; padding: .25rem .75rem;
  }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 44px; min-height: 44px; border-radius: var(--radius-sm);
    color: var(--faint);
  }
  .icon-btn:hover { color: var(--text); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .accent { color: var(--accent); }
  .sk { background-color: var(--surface-2); }
  .sheet-panel { background-color: var(--surface); border: 1px solid var(--border); }
  .toast { border: 1px solid transparent; }
  .toast-success { background-color: var(--accent-soft); color: #bef264; border-color: var(--accent-line); }
  .toast-error { background-color: rgba(239, 68, 68, .15); color: #fca5a5; border-color: rgba(239, 68, 68, .3); }
  .toast-info { background-color: rgba(39, 39, 42, .95); color: var(--text); border-color: var(--border); }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    background-color: var(--bg);
    color: var(--text);
    padding-top: env(safe-area-inset-top);
    /* deja hueco para la bottom nav fija + safe-area */
    padding-bottom: calc(5.5rem + env(safe-area-inset-bottom));
    overscroll-behavior-y: none;
  }
  /* ---- Bottom nav app-nativa ---- */
  #mainnav {
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    color: var(--muted);
    transition: color .15s ease-out, background-color .15s ease-out, transform .1s ease-out;
  }
  .nav-btn:active { transform: scale(.96); }
  .nav-btn .nav-pill { opacity: 0; transform: scale(.6); transition: opacity .15s ease-out, transform .15s ease-out; }
  .nav-btn[aria-selected="true"] { color: var(--accent); }
  .nav-btn[aria-selected="true"] .nav-pill { opacity: 1; transform: scale(1); }
  .nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 12px; }
  .nav-pill { background-color: var(--accent); }
  /* ---- Bottom sheet ---- */
  #sheetPanel {
    transform: translateY(100%);
    transition: transform .2s ease-out;
    margin-bottom: env(safe-area-inset-bottom);
  }
  #sheetBackdrop { opacity: 0; transition: opacity .2s ease-out; }
  #sheet.open #sheetPanel { transform: translateY(0); }
  #sheet.open #sheetBackdrop { opacity: 1; }
  /* ---- Pull to refresh ---- */
  #ptrPill {
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity .15s ease-out, transform .15s ease-out;
  }
  #ptrPill.ptr-show { opacity: 1; transform: translateY(0); }
  #ptrPill.ptr-ready { background-color: rgba(163, 230, 53, .15); color: #bef264; }
  /* ---- Toasts ---- */
  #toasts { bottom: calc(6rem + env(safe-area-inset-bottom)); }
  .toast {
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .18s ease-out, transform .18s ease-out;
  }
  .toast.toast-in { opacity: 1; transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) {
    .nav-btn, .nav-btn .nav-pill { transition: none !important; }
    #sheetPanel, #sheetBackdrop { transition: none !important; }
    #ptrPill { transition: none !important; }
    .toast { transition: none !important; }
    .btn, .icon-btn { transition: none !important; }
    .animate-pulse { animation: none !important; }
  }
</style>
</head>
<body class="min-h-screen">
<!-- Indicador pull-to-refresh -->
<div id="ptr" class="fixed top-0 inset-x-0 z-[70] flex justify-center pointer-events-none" aria-hidden="true" style="padding-top: env(safe-area-inset-top)">
  <div id="ptrPill" class="mt-2 px-3 py-1.5 rounded-full bg-zinc-800/95 text-xs font-semibold text-zinc-300">↓ Arrastra para actualizar</div>
</div>
<div class="max-w-5xl mx-auto px-4">

  <header class="py-6 flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-black tracking-tight">🏋️ LightWeight</h1>
      <p class="muted text-sm">Seguimiento local de entrenamientos</p>
    </div>
  </header>

  <nav id="mainnav" role="tablist" aria-label="Navegación principal"
       class="fixed bottom-0 inset-x-0 z-50 bg-zinc-950/95 backdrop-blur border-t border-zinc-800
              md:bottom-4 md:inset-x-auto md:left-1/2 md:-translate-x-1/2 md:w-[28rem] md:rounded-2xl md:border md:shadow-2xl">
    <div class="flex justify-around items-stretch px-2 pt-2">
      <button data-tab="entrenar" role="tab" aria-selected="true"
              class="tab-btn nav-btn flex flex-col items-center gap-1 px-3 pt-2 pb-1 min-w-[64px] min-h-[56px] rounded-xl">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span class="text-[11px] font-semibold leading-none">Entrenar</span>
        <span class="nav-pill h-1 w-8 rounded-full" aria-hidden="true"></span>
      </button>
      <button data-tab="rutinas" role="tab" aria-selected="false"
              class="tab-btn nav-btn flex flex-col items-center gap-1 px-3 pt-2 pb-1 min-w-[64px] min-h-[56px] rounded-xl">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
          <path d="M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          <path d="m9 14 2 2 4-4"/>
        </svg>
        <span class="text-[11px] font-semibold leading-none">Rutinas</span>
        <span class="nav-pill h-1 w-8 rounded-full" aria-hidden="true"></span>
      </button>
      <button data-tab="historial" role="tab" aria-selected="false"
              class="tab-btn nav-btn flex flex-col items-center gap-1 px-3 pt-2 pb-1 min-w-[64px] min-h-[56px] rounded-xl">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="text-[11px] font-semibold leading-none">Historial</span>
        <span class="nav-pill h-1 w-8 rounded-full" aria-hidden="true"></span>
      </button>
      <button data-tab="progreso" role="tab" aria-selected="false"
              class="tab-btn nav-btn flex flex-col items-center gap-1 px-3 pt-2 pb-1 min-w-[64px] min-h-[56px] rounded-xl">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-[11px] font-semibold leading-none">Progreso</span>
        <span class="nav-pill h-1 w-8 rounded-full" aria-hidden="true"></span>
      </button>
    </div>
  </nav>

  <!-- ============ ENTRENAR ============ -->
  <section id="tab-entrenar">
    <div class="card mb-4">
      <h2 class="font-bold text-lg mb-2">Iniciar sesión</h2>
      <div class="flex flex-col sm:flex-row gap-2">
        <select id="routineSelect" class="flex-1 input"></select>
        <input id="sessionName" placeholder="Nombre (opcional)" class="flex-1 input" />
      </div>
      <div class="flex gap-2 mt-3">
        <button onclick="startSession(true)" class="flex-1 btn btn-primary">▶ Desde rutina</button>
        <button onclick="startSession(false)" class="flex-1 btn btn-ghost">＋ Sesión libre</button>
      </div>
    </div>

    <div id="activeSession" class="hidden card card-accent mb-4">
      <div class="flex items-center justify-between gap-2 mb-2">
        <div>
          <h2 id="activeName" class="font-bold text-lg"></h2>
          <p id="activeMeta" class="text-xs muted"></p>
        </div>
        <button onclick="closeSession()" class="btn btn-quiet btn-sm">cerrar</button>
      </div>
      <label class="text-xs muted">Nota global de la sesión</label>
      <textarea id="activeNotes" rows="2" class="w-full input text-sm mb-3" placeholder="Cómo fue el entreno…"></textarea>
      <button onclick="saveSessionNotes(this)" class="btn btn-ghost text-xs mb-4">💾 Guardar nota</button>
      <div id="activeExercises" class="space-y-4"></div>
      <div class="mt-4 flex gap-2">
        <select id="addExSelect" class="flex-1 input"></select>
        <button onclick="addExerciseToSession()" class="btn btn-primary">Añadir</button>
      </div>
      <p class="text-xs faint mt-2">💡 Puedes añadir o quitar ejercicios y series sobre la marcha.</p>
    </div>

    <div class="card">
      <h3 class="font-bold mb-2">Catálogo de ejercicios</h3>
      <div class="flex gap-2 mb-3">
        <input id="newExName" placeholder="Nombre (ej: Hip thrust)" class="flex-1 input text-sm" />
        <input id="newExMuscle" placeholder="Músculo" class="w-32 input text-sm" />
        <button onclick="createExercise()" class="btn btn-primary text-sm">＋</button>
      </div>
      <div id="exerciseList" class="flex flex-wrap gap-2">
        <span class="inline-block h-6 w-24 sk rounded-full animate-pulse"></span>
        <span class="inline-block h-6 w-20 sk rounded-full animate-pulse"></span>
        <span class="inline-block h-6 w-28 sk rounded-full animate-pulse"></span>
        <span class="inline-block h-6 w-16 sk rounded-full animate-pulse"></span>
      </div>
    </div>
  </section>

  <!-- ============ RUTINAS ============ -->
  <section id="tab-rutinas" class="hidden">
    <div class="card mb-4">
      <h2 class="font-bold text-lg mb-2">Nueva rutina</h2>
      <div class="flex gap-2">
        <input id="newRoutineName" placeholder="Ej: Push Day" class="flex-1 input text-sm" />
        <button onclick="createRoutine()" class="btn btn-primary text-sm">Crear</button>
      </div>
      <input id="newRoutineDesc" placeholder="Descripción (opcional)" class="w-full mt-2 input text-sm" />
    </div>
    <div id="routineList" class="space-y-4">
      <div class="card-soft space-y-2"><div class="h-4 w-2/3 sk rounded animate-pulse"></div><div class="h-3 w-full sk rounded animate-pulse"></div><div class="h-3 w-1/2 sk rounded animate-pulse"></div></div>
      <div class="card-soft space-y-2"><div class="h-4 w-1/2 sk rounded animate-pulse"></div><div class="h-3 w-full sk rounded animate-pulse"></div></div>
    </div>
  </section>

  <!-- ============ HISTORIAL ============ -->
  <section id="tab-historial" class="hidden">
    <div class="card">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-lg">Últimas sesiones</h2>
        <button onclick="loadHistory()" class="btn btn-ghost btn-sm">↻ Recargar</button>
      </div>
      <div id="historyList" class="space-y-4">
        <div class="card-soft space-y-2"><div class="h-4 w-2/3 sk rounded animate-pulse"></div><div class="h-3 w-full sk rounded animate-pulse"></div><div class="h-3 w-1/2 sk rounded animate-pulse"></div></div>
        <div class="card-soft space-y-2"><div class="h-4 w-1/2 sk rounded animate-pulse"></div><div class="h-3 w-full sk rounded animate-pulse"></div></div>
        <div class="card-soft space-y-2"><div class="h-4 w-2/3 sk rounded animate-pulse"></div><div class="h-3 w-3/4 sk rounded animate-pulse"></div></div>
      </div>
    </div>
  </section>

  <!-- ============ PROGRESO ============ -->
  <section id="tab-progreso" class="hidden">
    <div class="card mb-4">
      <h2 class="font-bold text-lg mb-2">Evolución por ejercicio</h2>
      <select id="progressSelect" class="w-full input" onchange="loadProgress()"></select>
      <div id="lastTime" class="text-sm text-zinc-300 mt-3 bg-zinc-800 rounded-xl p-3"></div>
    </div>
    <div class="card mb-4">
      <h3 class="font-bold text-sm mb-2">Peso máximo por sesión (kg)</h3>
      <canvas id="chartMax" height="120"></canvas>
    </div>
    <div class="card">
      <h3 class="font-bold text-sm mb-2">Volumen total por sesión (kg)</h3>
      <canvas id="chartVol" height="120"></canvas>
    </div>
  </section>

</div>

<!-- Contenedor de toasts: encima de la nav, debajo del sheet -->
<div id="toasts" class="fixed inset-x-0 z-[55] flex flex-col items-center gap-2 px-4 pointer-events-none" aria-live="polite"></div>

<!-- ============ BOTTOM SHEET (sustituye alert/confirm) ============ -->
<div id="sheet" class="fixed inset-0 z-[60] hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div id="sheetBackdrop" class="absolute inset-0 bg-black/60"></div>
  <div id="sheetPanel"
       class="absolute bottom-0 inset-x-0 mx-auto max-w-md sheet-panel
              rounded-t-2xl md:bottom-4 md:rounded-2xl md:shadow-2xl">
    <div class="flex items-center justify-between pl-4 pr-2 pt-2">
      <h3 id="sheetTitle" class="font-bold"></h3>
      <button id="sheetClose" class="icon-btn" aria-label="Cerrar">✕</button>
    </div>
    <div id="sheetBody" class="px-4 pb-2 text-sm text-zinc-300 max-h-[60vh] overflow-auto"></div>
    <div id="sheetActions" class="flex gap-2 p-4"></div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
  // Registra el Service Worker (scope /). No rompe si falla.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((err) => {
        console.warn("[PWA] SW no registrado:", err);
      });
    });
  }
</script>
</body>
</html>
