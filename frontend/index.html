<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>LightWeight — Seguimiento de entrenos</title>
<meta name="description" content="App local de seguimiento de entrenamientos en el gimnasio." />
<meta name="theme-color" content="#09090b" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LightWeight" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { color-scheme: dark; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    padding-top: env(safe-area-inset-top);
    /* deja hueco para la bottom nav fija + safe-area */
    padding-bottom: calc(5.5rem + env(safe-area-inset-bottom));
    overscroll-behavior-y: none;
  }
  /* ---- Bottom nav app-nativa ---- */
  #mainnav {
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-btn {
    color: #a1a1aa; /* zinc-400 */
    transition: color .15s ease-out, background-color .15s ease-out, transform .1s ease-out;
  }
  .nav-btn:active { transform: scale(.96); }
  .nav-btn .nav-pill { opacity: 0; transform: scale(.6); transition: opacity .15s ease-out, transform .15s ease-out; }
  .nav-btn[aria-selected="true"] { color: #a3e635; /* lime-400 */ }
  .nav-btn[aria-selected="true"] .nav-pill { opacity: 1; transform: scale(1); }
  .nav-btn:focus-visible { outline: 2px solid #a3e635; outline-offset: 2px; border-radius: 12px; }
  /* ---- Bottom sheet ---- */
  #sheetPanel {
    transform: translateY(100%);
    transition: transform .2s ease-out;
    margin-bottom: env(safe-area-inset-bottom);
  }
  #sheetBackdrop { opacity: 0; transition: opacity .2s ease-out; }
  #sheet.open #sheetPanel { transform: translateY(0); }
  #sheet.open #sheetBackdrop { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    .nav-btn, .nav-btn .nav-pill { transition: none !important; }
    #sheetPanel, #sheetBackdrop { transition: none !important; }
  }
</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
<div class="max-w-5xl mx-auto px-4">

  <header class="py-6 flex items-center justify-between">
    <div>
      <h1 class="text-3xl font-black tracking-tight">🏋️ LightWeight</h1>
      <p class="text-zinc-400 text-sm">Seguimiento local de entrenamientos</p>
    </div>
    <span id="status" class="text-xs px-3 py-1 rounded-full bg-zinc-800 text-zinc-300">conectando…</span>
  </header>

  <nav id="mainnav" role="tablist" aria-label="Navegación principal"
       class="fixed bottom-0 inset-x-0 z-50 bg-zinc-950/95 backdrop-blur border-t border-zinc-800
              md:bottom-4 md:inset-x-auto md:left-1/2 md:-translate-x-1/2 md:w-[28rem] md:rounded-2xl md:border md:shadow-2xl">
    <div class="flex justify-around items-stretch px-2 pt-2">
      <button data-tab="entrenar" role="tab" aria-selected="true"
              class="tab-btn nav-btn flex flex-col items-center gap-1 px-3 pt-2 pb-1 min-w-[64px] min-h-[56px] rounded-xl">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span class="text-[11px] font-semibold leading-none">Entrenar</span>
        <span class="nav-pill h-1 w-8 rounded-full bg-lime-400" aria-hidden="true"></span>
      </button>
      <button data-tab="rutinas" role="tab" aria-selected="false"
              class="tab-btn nav-btn flex flex-col items-center gap-1 px-3 pt-2 pb-1 min-w-[64px] min-h-[56px] rounded-xl">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
          <path d="M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
          <path d="m9 14 2 2 4-4"/>
        </svg>
        <span class="text-[11px] font-semibold leading-none">Rutinas</span>
        <span class="nav-pill h-1 w-8 rounded-full bg-lime-400" aria-hidden="true"></span>
      </button>
      <button data-tab="historial" role="tab" aria-selected="false"
              class="tab-btn nav-btn flex flex-col items-center gap-1 px-3 pt-2 pb-1 min-w-[64px] min-h-[56px] rounded-xl">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="text-[11px] font-semibold leading-none">Historial</span>
        <span class="nav-pill h-1 w-8 rounded-full bg-lime-400" aria-hidden="true"></span>
      </button>
      <button data-tab="progreso" role="tab" aria-selected="false"
              class="tab-btn nav-btn flex flex-col items-center gap-1 px-3 pt-2 pb-1 min-w-[64px] min-h-[56px] rounded-xl">
        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-[11px] font-semibold leading-none">Progreso</span>
        <span class="nav-pill h-1 w-8 rounded-full bg-lime-400" aria-hidden="true"></span>
      </button>
    </div>
  </nav>

  <!-- ============ ENTRENAR ============ -->
  <section id="tab-entrenar">
    <div class="bg-zinc-900 rounded-2xl p-4 mb-4">
      <h2 class="font-bold text-lg mb-2">Iniciar sesión</h2>
      <div class="flex flex-col sm:flex-row gap-2">
        <select id="routineSelect" class="flex-1 bg-zinc-800 rounded-xl px-3 py-2"></select>
        <input id="sessionName" placeholder="Nombre (opcional)" class="flex-1 bg-zinc-800 rounded-xl px-3 py-2" />
      </div>
      <div class="flex gap-2 mt-3">
        <button onclick="startSession(true)" class="flex-1 bg-lime-400 text-black font-bold rounded-xl px-3 py-2">▶ Desde rutina</button>
        <button onclick="startSession(false)" class="flex-1 bg-zinc-700 font-bold rounded-xl px-3 py-2">＋ Sesión libre</button>
      </div>
    </div>

    <div id="activeSession" class="hidden bg-zinc-900 rounded-2xl p-4 mb-4 border border-lime-400/30">
      <div class="flex items-center justify-between gap-2 mb-2">
        <div>
          <h2 id="activeName" class="font-bold text-lg"></h2>
          <p id="activeMeta" class="text-xs text-zinc-400"></p>
        </div>
        <button onclick="closeSession()" class="text-xs bg-zinc-800 rounded-lg px-3 py-1">cerrar</button>
      </div>
      <label class="text-xs text-zinc-400">Nota global de la sesión</label>
      <textarea id="activeNotes" rows="2" class="w-full bg-zinc-800 rounded-xl px-3 py-2 text-sm mb-3" placeholder="Cómo fue el entreno…"></textarea>
      <button onclick="saveSessionNotes(this)" class="text-xs bg-zinc-700 rounded-lg px-3 py-1 mb-4 min-h-[44px]">💾 Guardar nota</button>
      <div id="activeExercises" class="space-y-4"></div>
      <div class="mt-4 flex gap-2">
        <select id="addExSelect" class="flex-1 bg-zinc-800 rounded-xl px-3 py-2"></select>
        <button onclick="addExerciseToSession()" class="bg-lime-400 text-black font-bold rounded-xl px-4">Añadir</button>
      </div>
      <p class="text-xs text-zinc-500 mt-2">💡 Puedes añadir o quitar ejercicios y series sobre la marcha.</p>
    </div>

    <div class="bg-zinc-900 rounded-2xl p-4">
      <h3 class="font-bold mb-2">Catálogo de ejercicios</h3>
      <div class="flex gap-2 mb-3">
        <input id="newExName" placeholder="Nombre (ej: Hip thrust)" class="flex-1 bg-zinc-800 rounded-xl px-3 py-2 text-sm" />
        <input id="newExMuscle" placeholder="Músculo" class="w-32 bg-zinc-800 rounded-xl px-3 py-2 text-sm" />
        <button onclick="createExercise()" class="bg-lime-400 text-black font-bold rounded-xl px-4 text-sm">＋</button>
      </div>
      <div id="exerciseList" class="flex flex-wrap gap-2"></div>
    </div>
  </section>

  <!-- ============ RUTINAS ============ -->
  <section id="tab-rutinas" class="hidden">
    <div class="bg-zinc-900 rounded-2xl p-4 mb-4">
      <h2 class="font-bold text-lg mb-2">Nueva rutina</h2>
      <div class="flex gap-2">
        <input id="newRoutineName" placeholder="Ej: Push Day" class="flex-1 bg-zinc-800 rounded-xl px-3 py-2 text-sm" />
        <button onclick="createRoutine()" class="bg-lime-400 text-black font-bold rounded-xl px-4 text-sm">Crear</button>
      </div>
      <input id="newRoutineDesc" placeholder="Descripción (opcional)" class="w-full mt-2 bg-zinc-800 rounded-xl px-3 py-2 text-sm" />
    </div>
    <div id="routineList" class="space-y-4"></div>
  </section>

  <!-- ============ HISTORIAL ============ -->
  <section id="tab-historial" class="hidden">
    <div class="bg-zinc-900 rounded-2xl p-4">
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-bold text-lg">Últimas sesiones</h2>
        <button onclick="loadHistory()" class="text-xs bg-zinc-700 rounded-lg px-3 py-1">↻ Recargar</button>
      </div>
      <div id="historyList" class="space-y-4"></div>
    </div>
  </section>

  <!-- ============ PROGRESO ============ -->
  <section id="tab-progreso" class="hidden">
    <div class="bg-zinc-900 rounded-2xl p-4 mb-4">
      <h2 class="font-bold text-lg mb-2">Evolución por ejercicio</h2>
      <select id="progressSelect" class="w-full bg-zinc-800 rounded-xl px-3 py-2" onchange="loadProgress()"></select>
      <div id="lastTime" class="text-sm text-zinc-300 mt-3 bg-zinc-800 rounded-xl p-3"></div>
    </div>
    <div class="bg-zinc-900 rounded-2xl p-4 mb-4">
      <h3 class="font-bold text-sm mb-2">Peso máximo por sesión (kg)</h3>
      <canvas id="chartMax" height="120"></canvas>
    </div>
    <div class="bg-zinc-900 rounded-2xl p-4">
      <h3 class="font-bold text-sm mb-2">Volumen total por sesión (kg)</h3>
      <canvas id="chartVol" height="120"></canvas>
    </div>
  </section>

</div>

<!-- ============ BOTTOM SHEET (Fase 3: sustituye alert/confirm) ============ -->
<div id="sheet" class="fixed inset-0 z-[60] hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div id="sheetBackdrop" class="absolute inset-0 bg-black/60"></div>
  <div id="sheetPanel"
       class="absolute bottom-0 inset-x-0 mx-auto max-w-md bg-zinc-900 border border-zinc-800
              rounded-t-2xl md:bottom-4 md:rounded-2xl md:shadow-2xl">
    <div class="flex items-center justify-between pl-4 pr-2 pt-2">
      <h3 id="sheetTitle" class="font-bold"></h3>
      <button id="sheetClose" class="min-w-[44px] min-h-[44px] px-3 text-zinc-400 rounded-xl" aria-label="Cerrar">✕</button>
    </div>
    <div id="sheetBody" class="px-4 pb-2 text-sm text-zinc-300 max-h-[60vh] overflow-auto"></div>
    <div id="sheetActions" class="flex gap-2 p-4"></div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
  // Fase 1 PWA: registra el Service Worker (scope /). No rompe si falla.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((err) => {
        console.warn("[PWA] SW no registrado:", err);
      });
    });
  }
</script>
</body>
</html>
