# fly.toml app configuration file for LightWeight
# https://fly.io/docs/reference/configuration/

# Nombre de la aplicación en Fly.io (debe ser único a nivel global)
# Cámbialo o deja que `fly launch` te sugiera uno disponible
app = "lightweight-antonio"
primary_region = "cdg"

[build]

[env]
  LIGHTWEIGHT_DB_PATH = "/data/lightweight.db"

[mounts]
  source = "lightweight_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
